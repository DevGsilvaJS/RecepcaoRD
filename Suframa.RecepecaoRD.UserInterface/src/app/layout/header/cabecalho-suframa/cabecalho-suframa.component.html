<header class="app-header" aria-label="Cabeçalho do sistema">
  <div class="app-header__left">
    <div class="app-header__brand" aria-hidden="true"></div>
    <div class="app-header__texts">
      <div class="app-header__title">RECEPÇÃO RD</div>
      <div class="app-header__subtitle">Gerenciamento de Relatórios Demonstrativos</div>
    </div>
  </div>

  <div class="app-header__right" aria-label="Ações do cabeçalho">
    <div class="app-header__actions" role="group" aria-label="Ações">
      <button class="app-header__btn" type="button" aria-label="Manual">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6.5a1 1 0 0 1 0-5H20"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>

      <button class="app-header__btn" type="button" aria-label="Informações">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle
            cx="12"
            cy="12"
            r="10"
            stroke="currentColor"
            stroke-width="2"
          />
          <path
            d="M12 16v-4"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
          <path
            d="M12 8h.01"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
      </button>

      <div class="app-header__sep" aria-hidden="true"></div>

      <button class="app-header__btn" type="button" aria-label="Diminuir">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" class="is-small">
          <path
            d="M5 12h14"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
      </button>

      <button class="app-header__btn is-active" type="button" aria-label="Tipografia">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" class="is-small">
          <path
            d="M4 7V4h16v3"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M9 20h6"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
          <path
            d="M12 4v16"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
      </button>

      <button class="app-header__btn" type="button" aria-label="Letra A">
        <span class="app-header__letter" aria-hidden="true">A</span>
      </button>

      <div class="app-header__sep" aria-hidden="true"></div>

      <button class="app-header__btn" type="button" aria-label="Modo noturno">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>

      <button class="app-header__btn is-danger" type="button" aria-label="Sair" (click)="sair()">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M16 17l5-5-5-5"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M21 12H9"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
      </button>
    </div>
  </div>
</header>
